name: Bug report
description: Report incorrect or unsafe evidence behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private repository data, or personal information.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the incorrect output using a public repository or a synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Redact environment variables and credentials.
    validations:
      required: true
