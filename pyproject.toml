[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-health-snapshot"
version = "0.1.0"
description = "Generate reproducible health snapshots from public GitHub repository data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "IainZheng" },
]
keywords = ["github", "open-source", "maintainers", "evidence", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/IainZheng/repo-health-snapshot"
Issues = "https://github.com/IainZheng/repo-health-snapshot/issues"
Changelog = "https://github.com/IainZheng/repo-health-snapshot/blob/main/CHANGELOG.md"

[project.scripts]
repo-health-snapshot = "repo_health_snapshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
